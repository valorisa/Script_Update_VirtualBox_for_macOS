---
name: Lint Markdown
on:
  push:
    branches:
      - main
    paths:
      - "**/*.md"
  pull_request:
    branches:
      - main
    paths:
      - "**/*.md"
  workflow_dispatch:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: markdownlint-cli2-action
        uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          globs: "**/*.md"
